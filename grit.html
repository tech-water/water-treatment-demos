<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>曝气沉砂池运行效果监控系统</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  body {
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh; color:#e8f4f8; padding:20px;
  }
  .container { max-width:1400px; margin:0 auto; }
  header {
    text-align:center; padding:20px 0;
    border-bottom:2px solid rgba(255,255,255,0.1);
    margin-bottom:20px;
  }
  header h1 {
    font-size:28px; letter-spacing:2px;
    background:linear-gradient(90deg,#4fc3f7,#81d4fa,#4fc3f7);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p { color:#8ab; margin-top:8px; font-size:13px; }

  .status-bar {
    display:flex; justify-content:center; gap:30px; margin-top:12px; flex-wrap:wrap;
  }
  .status-item { display:flex; align-items:center; gap:6px; font-size:13px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#4caf50; box-shadow:0 0 8px #4caf50; animation:blink 1.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .grid-top {
    display:grid; grid-template-columns:repeat(5,1fr); gap:15px; margin-bottom:20px;
  }
  .card {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px; padding:16px; text-align:center;
    backdrop-filter:blur(6px);
    transition:transform .3s;
  }
  .card:hover { transform:translateY(-4px); border-color:#4fc3f7; }
  .card .label { font-size:12px; color:#9cc; margin-bottom:8px; }
  .card .value { font-size:26px; font-weight:bold; color:#4fc3f7; }
  .card .unit { font-size:12px; color:#789; margin-left:4px;}
  .card .trend { font-size:11px; margin-top:6px; }
  .up { color:#ff8a65; } .down { color:#81c784; } .stable { color:#90a4ae;}

  .main-section {
    display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:20px;
  }
  .panel {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px; padding:18px;
    backdrop-filter:blur(6px);
  }
  .panel h2 {
    font-size:16px; margin-bottom:14px; color:#81d4fa;
    border-left:4px solid #4fc3f7; padding-left:10px;
  }

  /* 曝气沉砂池可视化 */
  .tank-wrap { position:relative; }
  svg { width:100%; height:320px; }
  .water { fill:url(#waterGrad); }
  .bubble {
    fill:#fff; opacity:0.75;
    animation:rise linear infinite;
  }
  @keyframes rise {
    0% { transform:translateY(0); opacity:0; }
    10% { opacity:0.8; }
    90% { opacity:0.6; }
    100% { transform:translateY(-220px); opacity:0; }
  }
  .sand { fill:#6d4c41; }
  .flow-arrow { fill:#4fc3f7; }
  .label-text { fill:#cfe; font-size:11px; }

  /* 参数列表 */
  .param-list { display:flex; flex-direction:column; gap:12px; margin-top:10px;}
  .param-row {
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,0.04); padding:10px 14px; border-radius:8px;
  }
  .param-row .name { font-size:13px; color:#bcd; }
  .bar-bg { flex:1; height:8px; background:rgba(255,255,255,0.1); border-radius:4px; margin:0 12px; overflow:hidden;}
  .bar-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,#4fc3f7,#29b6f6); transition:width 1s;}
  .param-row .val { font-size:13px; color:#4fc3f7; min-width:60px; text-align:right;}

  .charts {
    display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;
  }
  canvas { width:100%; height:220px; background:rgba(0,0,0,0.15); border-radius:8px; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:10px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.08); }
  th { color:#81d4fa; font-weight:normal; background:rgba(255,255,255,0.04); }
  tr:hover td { background:rgba(79,195,247,0.08); }
  .tag { padding:3px 10px; border-radius:12px; font-size:11px; }
  .tag.good { background:rgba(76,175,80,0.2); color:#81c784; }
  .tag.warn { background:rgba(255,193,7,0.2); color:#ffd54f; }

  footer { text-align:center; padding:20px; color:#678; font-size:12px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>曝气沉砂池运行效果监控系统</h1>
    <p>Aerated Grit Chamber Real-time Monitoring Dashboard</p>
    <div class="status-bar">
      <div class="status-item"><span class="dot"></span> 系统运行正常</div>
      <div class="status-item" id="timeNow">2024-01-01 00:00:00</div>
      <div class="status-item">除砂效率达标 ✅</div>
    </div>
  </header>

  <!-- 顶部关键指标卡片 -->
  <div class="grid-top" id="cardGrid"></div>

  <div class="main-section">
    <!-- 左：池体可视化 -->
    <div class="panel tank-wrap">
      <h2>曝气沉砂池工艺可视化</h2>
      <svg viewBox="0 0 600 320">
        <defs>
          <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a8dbf"/>
            <stop offset="100%" stop-color="#1b4f72"/>
          </linearGradient>
        </defs>
        <!-- 池体外壁 -->
        <rect x="40" y="40" width="520" height="220" fill="none" stroke="#4fc3f7" stroke-width="3" rx="10"/>
        <!-- 水体 -->
        <rect x="43" y="60" width="514" height="195" class="water" rx="6"/>
        <!-- 进水箭头 -->
        <polygon class="flow-arrow" points="0,120 30,110 30,130"/>
        <text x="2" y="105" class="label-text">进水</text>
        <!-- 出水箭头 -->
        <polygon class="flow-arrow" points="600,170 570,160 570,180"/>
        <text x="565" y="150" class="label-text">出水</text>
        <!-- 沉砂斗 -->
        <polygon class="sand" points="60,255 160,255 110,300"/>
        <text x="80" y="315" class="label-text">沉砂斗</text>
        <polygon class="sand" points="440,255 540,255 490,300"/>
        <text x="465" y="315" class="label-text">沉砂斗</text>
        <!-- 排砂管 -->
        <rect x="100" y="298" width="20" height="18" fill="#8d6e63"/>
        <rect x="480" y="298" width="20" height="18" fill="#8d6e63"/>

        <!-- 曝气装置 -->
        <rect x="60" y="250" width="480" height="6" fill="#263238"/>
        <g id="bubbleGroup"></g>

        <!-- 水面波纹文字 -->
        <text x="260" y="80" class="label-text" font-size="13" fill="#bfe">曝气搅拌区</text>
        <text x="500" y="25" fill="#4fc3f7" font-size="12">DO: <tspan id="doSvgVal">3.2</tspan> mg/L</text>
      </svg>
      <div style="display:flex;justify-content:space-around;margin-top:10px;font-size:12px;color:#9cc;">
        <div>🌀 鼓风机运行中</div>
        <div>⚙️ 刮砂机运行中</div>
        <div>💧 水位正常</div>
      </div>
    </div>

    <!-- 右：实时参数 -->
    <div class="panel">
      <h2>实时运行参数</h2>
      <div class="param-list" id="paramList"></div>
    </div>
  </div>

  <!-- 图表区 -->
  <div class="charts">
    <div class="panel">
      <h2>进/出水流量趋势 (m³/h)</h2>
      <canvas id="flowChart"></canvas>
    </div>
    <div class="panel">
      <h2>溶解氧 & 除砂效率趋势</h2>
      <canvas id="doChart"></canvas>
    </div>
  </div>

  <!-- 历史记录表 -->
  <div class="panel">
    <h2>最近运行记录</h2>
    <table>
      <thead>
        <tr><th>时间</th><th>进水流量(m³/h)</th><th>溶解氧(mg/L)</th><th>除砂量(kg/h)</th><th>水温(℃)</th><th>运行状态</th></tr>
      </thead>
      <tbody id="recordBody"></tbody>
    </table>
  </div>

  <footer>曝气沉砂池运行监控系统 © 模拟演示数据，仅供参考</footer>
</div>

<script>
// ---------- 时间显示 ----------
function updateTime(){
  const now = new Date();
  document.getElementById('timeNow').textContent = now.getFullYear()+'-'+
    String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+
    String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
}
setInterval(updateTime,1000); updateTime();

// ---------- 顶部卡片数据 ----------
const cardData = [
  {label:'进水流量', key:'inflow', unit:'m³/h', base:850, range:40},
  {label:'出水流量', key:'outflow', unit:'m³/h', base:845, range:40},
  {label:'溶解氧(DO)', key:'do', unit:'mg/L', base:3.0, range:0.6},
  {label:'除砂效率', key:'eff', unit:'%', base:94, range:3},
  {label:'水温', key:'temp', unit:'℃', base:18, range:2},
];
const cardGrid = document.getElementById('cardGrid');
cardData.forEach(c=>{
  const div = document.createElement('div');
  div.className='card';
  div.innerHTML = `<div class="label">${c.label}</div>
    <div><span class="value" id="val_${c.key}">--</span><span class="unit">${c.unit}</span></div>
    <div class="trend stable" id="trend_${c.key}">持平</div>`;
  cardGrid.appendChild(div);
});

// ---------- 参数列表（带进度条）----------
const params = [
  {name:'曝气量', key:'air', unit:'m³/min', max:120},
  {name:'水位', key:'level', unit:'m', max:4},
  {name:'刮砂机转速', key:'speed', unit:'rpm', max:10},
  {name:'污泥浓度 SS', key:'ss', unit:'mg/L', max:300},
  {name:'pH值', key:'ph', unit:'', max:14},
];
const paramList = document.getElementById('paramList');
params.forEach(p=>{
  const row = document.createElement('div');
  row.className='param-row';
  row.innerHTML = `<div class="name">${p.name}</div>
    <div class="bar-bg"><div class="bar-fill" id="bar_${p.key}" style="width:0%"></div></div>
    <div class="val" id="val_${p.key}">--</div>`;
  paramList.appendChild(row);
});

let lastValues = {};
function randomWalk(base, range){
  return +(base + (Math.random()-0.5)*range).toFixed(2);
}

function updateCards(){
  cardData.forEach(c=>{
    const v = randomWalk(c.base, c.range);
    const elVal = document.getElementById('val_'+c.key);
    const elTrend = document.getElementById('trend_'+c.key);
    const prev = lastValues[c.key] ?? v;
    elVal.textContent = v;
    let diff = v - prev;
    if(Math.abs(diff) < c.range*0.05){
      elTrend.textContent = '— 持平';
      elTrend.className = 'trend stable';
    } else if(diff > 0){
      elTrend.textContent = '▲ 上升';
      elTrend.className = 'trend up';
    } else {
      elTrend.textContent = '▼ 下降';
      elTrend.className = 'trend down';
    }
    lastValues[c.key] = v;
    if(c.key==='do') document.getElementById('doSvgVal').textContent = v;
  });

  const paramMeta = {air:120, level:4, speed:10, ss:300, ph:14};
  const paramBase = {air:80, level:2.8, speed:6, ss:180, ph:7.2};
  const paramRange = {air:20, level:0.4, speed:2, ss:40, ph:0.6};
  params.forEach(p=>{
    const v = randomWalk(paramBase[p.key], paramRange[p.key]);
    const pct = Math.min(100, (v/paramMeta[p.key])*100);
    document.getElementById('bar_'+p.key).style.width = pct+'%';
    document.getElementById('val_'+p.key).textContent = v + (p.unit? ' '+p.unit:'');
  });
}

// ---------- 曝气气泡动画 ----------
const bubbleGroup = document.getElementById('bubbleGroup');
function createBubble(){
  const x = 70 + Math.random()*460;
  const r = 2 + Math.random()*3;
  const dur = 2 + Math.random()*2;
  const bubble = document.createElementNS('http://www.w3.org/2000/svg','circle');
  bubble.setAttribute('cx', x);
  bubble.setAttribute('cy', 250);
  bubble.setAttribute('r', r);
  bubble.setAttribute('class','bubble');
  bubble.style.animationDuration = dur+'s';
  bubbleGroup.appendChild(bubble);
  setTimeout(()=> bubble.remove(), dur*1000);
}
setInterval(createBubble, 150);

// ---------- 图表绘制 (Canvas 折线图) ----------
function drawLineChart(canvasId, seriesArr, colors, labels, maxVal){
  const canvas = document.getElementById(canvasId);
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const padding = 30;
  const plotW = w - padding*2;
  const plotH = h - padding*2;

  // 网格线
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const y = padding + (plotH/4)*i;
    ctx.beginPath(); ctx.moveTo(padding,y); ctx.lineTo(w-padding,y); ctx.stroke();
  }

  seriesArr.forEach((series, idx)=>{
    ctx.beginPath();
    ctx.strokeStyle = colors[idx];
    ctx.lineWidth = 2;
    series.forEach((v,i)=>{
      const x = padding + (plotW/(series.length-1))*i;
      const y = padding + plotH - (v/maxVal[idx])*plotH;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();

    // 填充渐变
    ctx.lineTo(padding+plotW, padding+plotH);
    ctx.lineTo(padding, padding+plotH);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0,padding,0,padding+plotH);
    grad.addColorStop(0, colors[idx]+'55');
    grad.addColorStop(1, colors[idx]+'00');
    ctx.fillStyle = grad;
    ctx.fill();
  });

  // x轴标签
  ctx.fillStyle = '#789';
  ctx.font = '10px Microsoft YaHei';
  labels.forEach((l,i)=>{
    if(i% Math.ceil(labels.length/6) === 0){
      const x = padding + (plotW/(labels.length-1))*i;
      ctx.fillText(l, x-10, h-8);
    }
  });
}

// 生成历史数据序列
const N = 24;
let timeLabels = [];
let inflowSeries = [], outflowSeries = [], doSeries = [], effSeries = [];
for(let i=0;i<N;i++){
  timeLabels.push(i+':00');
  inflowSeries.push(randomWalk(850,60));
  outflowSeries.push(randomWalk(845,60));
  doSeries.push(randomWalk(3.0,1));
  effSeries.push(randomWalk(94,5));
}

function refreshCharts(){
  // 滚动更新序列
  inflowSeries.shift(); inflowSeries.push(randomWalk(850,60));
  outflowSeries.shift(); outflowSeries.push(randomWalk(845,60));
  doSeries.shift(); doSeries.push(randomWalk(3.0,1));
  effSeries.shift(); effSeries.push(randomWalk(94,5));

  drawLineChart('flowChart', [inflowSeries, outflowSeries], ['#4fc3f7','#81c784'], timeLabels, [1000,1000]);
  drawLineChart('doChart', [doSeries, effSeries], ['#ffb74d','#ba68c8'], timeLabels, [6,100]);
}

// ---------- 记录表 ----------
const recordBody = document.getElementById('recordBody');
function addRecord(){
  const now = new Date();
  const timeStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  const inflow = randomWalk(850,60).toFixed(1);
  const doV = randomWalk(3.0,1).toFixed(2);
  const sand = randomWalk(25,8).toFixed(1);
  const temp = randomWalk(18,2).toFixed(1);
  const statusGood = doV > 2;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${timeStr}</td><td>${inflow}</td><td>${doV}</td><td>${sand}</td><td>${temp}</td>
    <td><span class="tag ${statusGood?'good':'warn'}">${statusGood?'正常':'关注'}</span></td>`;
  recordBody.prepend(tr);
  while(recordBody.children.length > 8) recordBody.removeChild(recordBody.lastChild);
}

// ---------- 初始化 & 定时刷新 ----------
updateCards();
refreshCharts();
for(let i=0;i<6;i++) addRecord();

setInterval(updateCards, 2000);
setInterval(refreshCharts, 3000);
setInterval(addRecord, 4000);
window.addEventListener('resize', refreshCharts);
</script>
</body>
</html>
